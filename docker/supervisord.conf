; Supervisor runs every WemX process inside one container.
; Set WEMX_RUN_QUEUE=false or WEMX_RUN_SCHEDULER=false to disable a process
; (for example when running dedicated worker containers).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Background jobs: provisioning orders, sending emails.
; --max-time recycles the worker hourly so it picks up .env changes (e.g. after the installer).
[program:queue]
command=/bin/sh -c 'if [ "${WEMX_RUN_QUEUE:-true}" = "true" ]; then sleep 5; exec php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600; else exec tail -f /dev/null; fi'
user=www-data
autorestart=true
startsecs=0
startretries=999
stopwaitsecs=60
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Billing automation: suspensions, terminations, renewals, currency rates, mass mails…
[program:scheduler]
command=/bin/sh -c 'if [ "${WEMX_RUN_SCHEDULER:-true}" = "true" ]; then sleep 5; exec php /var/www/html/artisan schedule:work; else exec tail -f /dev/null; fi'
user=www-data
autorestart=true
startsecs=0
startretries=999
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
