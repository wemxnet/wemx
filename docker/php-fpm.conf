; WemX PHP-FPM pool overrides
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Pass the container's environment variables (DB_HOST, APP_URL, …) through to PHP.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
