; WemX PHP settings for the Docker image
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
expose_php = Off

; OPcache. validate_timestamps stays on because the web installer and marketplace
; write PHP files at runtime (e.g. new extensions).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
