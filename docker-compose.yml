# WemX with Docker Compose
#
#   cp docker/wemx.env.example docker/wemx.env   # then edit passwords and APP_URL
#   docker compose up -d --build
#
# Open APP_URL (default http://localhost:8080) to run the web installer.
# Full guide: https://v3.wemx.net/docs/install-guides/docker

name: wemx

services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: wemx:local
        restart: unless-stopped
        env_file:
            - docker/wemx.env
        ports:
            - "${WEMX_HTTP_PORT:-8080}:80"
        volumes:
            - wemx-config:/config                          # .env written by the installer (contains APP_KEY)
            - wemx-storage:/var/www/html/storage           # logs, cache, uploaded files
            - wemx-extensions:/var/www/html/extensions     # extensions installed from the marketplace
            - wemx-assets:/var/www/html/public/assets      # theme assets and uploaded images
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mariadb:11.4
        restart: unless-stopped
        env_file:
            - docker/wemx.env
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - wemx-db:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

volumes:
    wemx-config:
    wemx-storage:
    wemx-extensions:
    wemx-assets:
    wemx-db:
